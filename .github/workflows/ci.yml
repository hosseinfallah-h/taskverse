name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which parts of the repo changed
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/mobile-ci.yml'

  backend:
    name: Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/backend-ci.yml

  mobile:
    name: Mobile
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    uses: ./.github/workflows/mobile-ci.yml

  # Final gate — fails if any required job failed.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [changes, backend, mobile]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.backend.result }}" == "failure" ]]; then
            echo "Backend CI failed"
            exit 1
          fi
          if [[ "${{ needs.mobile.result }}" == "failure" ]]; then
            echo "Mobile CI failed"
            exit 1
          fi
          echo "All checks passed (or skipped)"