[project]
name = "taskverse-backend"
version = "0.0.1"
description = "TaskVerse FastAPI backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # FastAPI Depends() in default args
    "UP038",  # isinstance tuple vs union — cosmetic
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]                     # re-exports
"backend/scripts/*.py" = ["E402"]            # sys.path hack before import
"scripts/*.py" = ["E402"]                    # sys.path hack before import
"app/main.py" = ["E402"]                     # deferred imports after config

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:starlette.*",
    "ignore::UserWarning:fastapi.*",
    "ignore::Warning:starlette.testclient",
]